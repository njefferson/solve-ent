name: Gates

# Everything that can be checked without a person looking at a screen.
#
# The privacy gate is here from this repository's FIRST workflow, per Doctrine
# §9b: a repository that waits to be caught by somebody running the script by
# hand is not gated. It runs the hub's CANONICAL copy rather than a fork, so a
# pattern widened in the hub binds here on the next push with no copy to drift.
#
# Nothing in this job pushes, and nothing in it needs a token, so the checkout
# leaves no credential in .git/config for whatever step gets added next year.
#
# THE DEPLOY IS ITS OWN WORKFLOW, in deploy.yml, and it runs on `main` only.
# This one gates; that one ships. They do not wait on each other, because what
# protects `main` is that nothing reaches it except a promotion of a commit
# these gates have already passed on `staging`.

# `staging` and `main` only, deliberately. The harness's own `claude/*` branch
# is kept pointing at the same commit as `staging`, so listing it here would buy
# no coverage and cost a second full run of identical bytes on every push.
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

env:
  # The hub commit this repository has reconciled with. Moved by
  # `doctrine-sync.mjs --adopt`, and this pin moves with it — CI runs the hub's
  # canonical gates AT THIS SHA, so leaving it behind would mean every gate
  # going green while running a check that had never heard of the rule it is
  # supposed to enforce.
  HUB_SHA: ac9fcd2866166ab03f5fc27d47c24148a26b09d1

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The hub, at an untracked path, pinned by SHA. `.hub` is the name the
      # hub's own gates know to skip when they walk a sibling's tree.
      - name: Check the hub out for the shared gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: njefferson/noahjefferson
          ref: ${{ env.HUB_SHA }}
          path: .hub
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ---- the doctrine gates ----
      #
      # FIRST, deliberately. A step that fails stops the job, so anything after
      # it is skipped — and a privacy gate sitting behind a long test run is a
      # HARD gate that silently does not run on the day the tests break.
      # Cheapest and most important first.

      - name: The owner's person is not repo material
        run: node .hub/privacy-check.mjs --repo .

      - name: Every set-apart quotation says whose words it is
        run: node .hub/quote-check.mjs --repo .

      - name: No grids in anything the owner reads
        run: node .hub/docs-check.mjs .

      - name: npm hygiene
        run: node .hub/pin-check.mjs --repo .

      # --artefact, NOT the plain check. The plain check also asserts that
      # `.git/hooks/pre-commit` is installed, which is a fact about ONE CLONE,
      # and `actions/checkout` leaves `.git/hooks` empty by definition — so a
      # runner can never satisfy it and the step would fail on every push. What
      # a runner CAN check is that the tracked hook still matches what
      # `.branch-guard` declares, which is the drift that matters. Never
      # `--install` here instead: that WRITES the tracked file and repairs the
      # one defect the step exists to find. (Hub LESSONS 107.)
      - name: The branch guard has not drifted from what it declares
        run: node .hub/branch-guard.mjs --repo . --artefact

      # ---- the engine's own checks ----

      - name: Type check
        run: npm run typecheck

      - name: The release triplet is written once
        run: npm run version:check

      # No score, no streak, no target, no congratulation — and no copy that
      # assumes a classroom. Comments are stripped before matching, because the
      # comments are exactly where the words that must NOT be built are written
      # down. It also runs on every commit through `.branch-guard`; here it
      # covers the case where somebody committed without the hook installed.
      # The hub commit is written in two files — the reconciliation marker and
      # the SHA this job checks the hub out at — and they drift silently. A pin
      # left behind means every shared gate above went green while running a
      # check that had never heard of the rule this repository has adopted.
      - name: The hub pin and the doctrine marker agree
        run: npm run pin

      # Every source file is in SOME project. `exclude` is inherited through
      # `extends`, which is how a whole directory came to be checked by neither
      # config while both exited 0 — two green runs over an empty set.
      - name: Every source file is in a TypeScript project
        run: npm run coverage

      # The colours come from one file, and it is the file the hub's palette
      # gate measures. Two declarations means what was measured and what a
      # browser paints can differ.
      - name: The palette, and the tokens generated from it
        run: npm run palette:check

      # public/ IS the site, so the engine a browser runs lives in the tree
      # rather than being built at deploy time. That makes staleness the risk.
      - name: The engine a browser runs matches its source
        run: npm run web:check

      # The worker's cache name must move with the release and its precache list
      # must be what public/ contains. A cache name that does not change means
      # everyone who has the app keeps the old shell forever.
      - name: The service worker and the manifest
        run: npm run pwa:check

      # Doctrine §7h, from the hub, at the pinned commit.
      - name: An app that caches itself can say it is stale
        run: node .hub/pwa-check.mjs --repo .

      - name: The words
        run: npm run copy

      # The release notes come from ONE source and are BOUNDED — the current
      # release plus four, with everything older on a page in the app rather
      # than a link off to a code host. A generated artefact in the tree goes
      # stale in the tree, so this is checked here as well as on every commit.
      - name: The release notes have not drifted from their one source
        run: npm run notes:check

      # Prints the two numbers this project is measured by: the taxonomy
      # collision count, which must be zero, and the unclassified rate.
      - name: Tests
        run: npm test

      # FROM OUTSIDE THE ENGINE, which is the point. `npm test` is thorough and
      # self-referential in one way: solve() produces the answer, the test
      # writes it down, and classify accepts it — all three could share one
      # mistake and stay green. This substitutes every rearranged answer back
      # INTO its own relation, recomputes six topics by hand, and holds every
      # conversion factor to a value typed in from a published source.
      - name: The algebra, checked without asking the engine to mark its own work
        run: npm run algebra

      # THE BROWSER GATES. Every surface in both modes, dialogs opened rather
      # than skipped, and then the primary journey walked with a step wrong on
      # purpose. A resting-state sweep reports a clean bill of health it has not
      # earned: most of this app's controls live inside dialogs.
      - name: Install Chromium for the browser gates
        run: npx playwright install --with-deps chromium

      - name: Accessibility, every surface in both modes
        run: npm run a11y

      # ON THE SCREEN RATHER THAN IN THE DOCUMENT. Every other browser gate here
      # runs at 390x844, a phone with nothing covering it — and this app has
      # twice shipped a control that was correct, measured and completely
      # invisible on the device it is used on. Conformance is not reachability.
      - name: Reachable at 390x380, with the keyboard up
        run: npm run fold

      - name: The walk
        run: npm run walk

      # The stale-app path, against a REAL second worker. The hub's pwa gate
      # reads source and says so itself: it catches never-implemented, not
      # implemented-subtly-wrong. This serves one release, installs it, serves a
      # different one, and walks what a reader experiences.
      - name: The stale-app path, with a real second worker
        run: npm run update-walk

      - name: Install zizmor (version- and hash-pinned by the hub)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --only-binary=:all: \
            --require-hashes -r .hub/.github/requirements-ci.txt

      # --strict-collection is not optional. Without it an unparseable workflow
      # is logged, skipped, and the audit still exits 0 with "No findings" — the
      # file most likely to be wrong is the one excused.
      - name: Workflow security audit
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --strict-collection \
            .github/workflows/
